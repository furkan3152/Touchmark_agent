[project]
name = "invoice-settler"
version = "0.4.2"
description = "Settles vendor invoices in USDC on Stellar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "stellar-sdk>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
