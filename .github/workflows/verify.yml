name: Verify audit boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      STELLAR_NETWORK: offline
      ALLOW_MAINNET: 'false'
      ENABLE_AUDIT_ESCROW: 'false'
      LLM_PROVIDER: ''
      LLM_API_KEY: ''
      PINATA_JWT: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: pip check
      - run: python -m pytest -q
      - run: node --check frontend/studio.js
      - run: node --check frontend/checkout.js && node --check frontend/orders.js
      - run: python scripts/verify_local.py
  contracts:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --target wasm32v1-none --release --locked
