name: Ledger proof
# Re-checks the public record from outside the project's servers: every assay-book entry
# against its stamp on Stellar testnet, the book's totals counted from the ledger, and the
# deployed contracts' code hashes against the manifests.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Every entry matches its stamp, and the site's totals match the ledger
        run: python scripts/verify_assay.py --ledger --latest 25
      - name: The deployed contracts match the manifests
        run: pip install stellar-sdk==16.0.0 && python scripts/verify_contracts.py --ledger
