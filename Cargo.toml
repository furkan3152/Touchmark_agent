[workspace]
resolver = "2"
members = [
  "contracts/agent-registry",
  "contracts/audit-escrow",
]

[workspace.dependencies]
soroban-sdk = "=25.3.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

