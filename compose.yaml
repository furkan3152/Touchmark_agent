services:
  touchmark:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      EVENT_DATABASE: /app/data/events.db
      # Empty: /app/data/touchmark.db, or the pre-rename agentveritas.db already in the volume.
      DATABASE_URL: ""
      OFFICIAL_ORDERS_DATABASE: /app/data/official-orders.db
    volumes:
      - veritas-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  # Named before the rename. Kept so existing deployments keep their data volume.
  veritas-data:
